events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format upstream_log '$remote_addr $host $request '
                          'status=$status upstream=$upstream_addr '
                          'response=$upstream_response_time';
  access_log /var/log/nginx/access.log upstream_log;

  upstream web_cluster {
    server web:5000 max_fails=2 fail_timeout=10s;
    server web_replica:5000 max_fails=2 fail_timeout=10s;
    keepalive 16;
  }

  upstream admin_backend {
    server admin:5001;
  }

  # HTTP -> HTTPS бағыттау
  server {
    listen 80;
    server_name lab.local admin.lab.local;

    location = /nginx-health { return 200 "nginx ok\n"; }
    location / { return 301 https://$host$request_uri; }
  }

  # 1. Пайдаланушылар сайты (https://lab.local)
  server {
    listen 443 ssl;
    server_name lab.local;

    ssl_certificate     /etc/nginx/certs/lab.local.crt;
    ssl_certificate_key /etc/nginx/certs/lab.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /static/ {
      alias /srv/static/;
      expires 7d;
      add_header Cache-Control "public";
    }

    location = /nginx-health { return 200 "nginx ok\n"; }

    location / {
      proxy_pass http://web_cluster;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }
  }

  # 2. Админ сервері (https://admin.lab.local)
  server {
    listen 443 ssl;
    server_name admin.lab.local;

    ssl_certificate     /etc/nginx/certs/lab.local.crt;
    ssl_certificate_key /etc/nginx/certs/lab.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /static/ {
      alias /srv/static/;
      expires 7d;
      add_header Cache-Control "public";
    }

    location / {
      proxy_pass http://admin_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}