x-web-base: &web-base
  build: .
  command: gunicorn --bind 0.0.0.0:5000 --workers 2 app:app
  environment:
    PRIMARY_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_primary:5432/${POSTGRES_DB}
    STANDBY_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_standby:5432/${POSTGRES_DB}
    SECRET_KEY: ${SECRET_KEY}
  expose:
    - "5000"
  depends_on:
    postgres_primary:
      condition: service_healthy
    postgres_standby:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
    interval: 5s
    timeout: 3s
    retries: 15

services:
  postgres_primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REPLICATOR_USER: ${REPLICATOR_USER}
      REPLICATOR_PASSWORD: ${REPLICATOR_PASSWORD}
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./db_init/init_primary.sh:/docker-entrypoint-initdb.d/init_primary.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15

  postgres_standby:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${REPLICATOR_PASSWORD}
    command: |
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        until pg_isready -h postgres_primary -p 5432; do sleep 2; done
        rm -rf /var/lib/postgresql/data/*
        pg_basebackup -h postgres_primary -D /var/lib/postgresql/data -U ${REPLICATOR_USER} -v -P -R -X stream
        chmod 0700 /var/lib/postgresql/data
      fi
      exec docker-entrypoint.sh postgres -c hot_standby=on
      "
    volumes:
      - pg_standby_data:/var/lib/postgresql/data
    depends_on:
      postgres_primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15

  web:
    <<: *web-base

  web_replica:
    <<: *web-base

  admin:
    build: .
    command: gunicorn --bind 0.0.0.0:5001 --workers 2 admin_app:admin_app
    environment:
      PRIMARY_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_primary:5432/${POSTGRES_DB}
      STANDBY_DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_standby:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    expose:
      - "5001"
    depends_on:
      postgres_primary:
        condition: service_healthy
      postgres_standby:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 5s
      timeout: 3s
      retries: 15

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./static:/srv/static:ro
    depends_on:
      web:
        condition: service_healthy
      web_replica:
        condition: service_healthy
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_primary_data:
  pg_standby_data: